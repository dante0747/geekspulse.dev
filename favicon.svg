<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GeeksPulse">
  <defs>
    <pattern id="leds" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#FFB224" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Panel: a dark LED board -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0C0A"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#leds)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#3A3F2F" stroke-width="1.5"/>

  <!-- The pulse: a heartbeat that ends in a terminal cursor -->
  <g fill="none" stroke="#FFB224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 37 H20 L25.5 25 L31.5 47 L37.5 15 L42.5 37 H45" opacity="0.55" filter="url(#glow)"/>
    <path d="M10 37 H20 L25.5 25 L31.5 47 L37.5 15 L42.5 37 H45"/>
  </g>
  <rect x="48" y="27" width="8" height="12" rx="1" fill="#6EF08F"/>
</svg>
